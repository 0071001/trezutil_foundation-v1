        end_date: { type: string, format: date }
        budget_minor: { type: integer, minimum: 0, description: Minor units; needs a currency }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        preferences: { type: object, maxProperties: 20, additionalProperties: { type: string, maxLength: 200 } }
    UpdateMissionRequest:
      type: object
      additionalProperties: false
      properties:
        objective: { type: string, minLength: 3, maxLength: 2000 }
        type: { $ref: '#/components/schemas/MissionType' }
        title: { type: string, minLength: 2, maxLength: 120 }
        location: { type: string, maxLength: 120 }
        participants: { type: integer, minimum: 0, maximum: 100000 }
        start_date: { type: string, description: 'YYYY-MM-DD; an empty string clears it' }
        end_date: { type: string, description: 'YYYY-MM-DD; an empty string clears it' }
        budget_minor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        preferences: { type: object, additionalProperties: { type: string } }
        status: { $ref: '#/components/schemas/MissionStatus' }
    Mission:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MissionType' }
        title: { type: string }
        objective: { type: string }
        status: { $ref: '#/components/schemas/MissionStatus' }
        location: { type: string }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        participants: { type: integer }
        budget_minor: { type: integer }
        currency: { type: string }
        preferences: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MissionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Mission' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    CreateMissionStepRequest:
      type: object
      additionalProperties: false
      required: [type, title]
      properties:
        type: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_ ]{1,31}$', description: A code such as VENUE or CATERING }
        title: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        action_type: { type: string, description: 'The commerce action a later phase will run, for example SEARCH_LISTINGS' }
    MissionStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending, in_progress, completed, skipped, failed] }
        position: { type: integer, minimum: 1 }
        action_type: { type: string }
        action_support: { type: string, enum: ['', supported, not_yet_supported], description: 'supported when a handler for action_type is registered in the Commerce Action Runtime; empty for a step added by hand' }
        plan_version: { type: integer, minimum: 0, description: 0 for a step added by hand }
        executable: { type: boolean, description: Whether the step has an executable action behind it that the runtime supports }
        can_execute: { type: boolean, description: 'Whether it can be executed now (executable, mission draft or active, step pending or failed or stale)' }
        stale: { type: boolean, description: In progress but its attempt has gone silent; it can be executed again }
        execution: { $ref: '#/components/schemas/MissionStepExecution' }
        state:
          type: string
          enum: [pending, ready, running, completed, failed, blocked, skipped]
          description: >
            Where the step stands in the current plan's dependency graph; derived, never stored (the stored status stays
            one of the five above). Absent for a step added by hand or of a plan that has been replaced.
        depends_on: { type: array, items: { type: string, format: uuid }, description: The steps this one waits for }
        blocked_by: { type: array, items: { type: string, format: uuid }, description: The dependencies that keep a blocked step blocked }
        reason:
          type: string
          enum: [waiting, not_executable, abandoned, dependency_failed, dependency_blocked, dependency_skipped, needs_input, needs_confirmation]
          description: Why a step waits or is blocked
        detail: { type: string, enum: [dates, listing], description: What is missing when the reason is needs_input }
        action_ref: { type: string, description: The action the step ran as; empty until steps are connected to the runtime }
        result_ref: { type: string, description: What the step produced; empty until steps are connected to the runtime }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MissionPlan:
      type: object
      properties:
        mission_id: { type: string, format: uuid }
        mission_type: { $ref: '#/components/schemas/MissionType' }
        plannable: { type: boolean, description: Whether the planner has a plan for the mission's kind }
        status: { type: string, enum: [current, superseded, none, needs_information] }
        needs_information: { type: boolean }
        reason: { type: string, description: 'Why more information is needed, for example no_template' }
        plan_version: { type: integer, minimum: 0, description: 0 when there is no plan }
        plan_mission_type: { $ref: '#/components/schemas/MissionType' }
        planner: { type: string, example: rules }
        planner_version: { type: string }
        versions: { type: array, items: { type: integer } }
        created_at: { type: string, format: date-time }
        superseded_at: { type: string, format: date-time }
        steps: { type: array, items: { $ref: '#/components/schemas/MissionStep' } }
    MissionStepExecution:
      type: object
      properties:
        id: { type: string, format: uuid }
        attempt: { type: integer, minimum: 1 }
        status: { type: string, enum: [in_progress, completed, failed] }
        action_type: { type: string, example: SEARCH_LISTINGS }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        result:
          type: object
          description: Present when completed. A small summary with references, never a copy of commerce data.
          properties:
            reference: { type: string, description: 'What the attempt produced; for a search, this execution' }
            total: { type: integer }
            listing_ids: { type: array, items: { type: string }, description: The first listings found (at most 10) }
            has_more: { type: boolean }
            vertical: { type: string }
            location: { type: string }
            available: { type: boolean, description: 'For an availability check, whether the listing is free then' }
            listing_id: { type: string, description: 'For an availability check, the listing that was checked (the reference)' }
            capacity: { type: integer }
            remaining: { type: integer }
            reason: { type: string }
            start_at: { type: integer, description: Unix seconds }
            end_at: { type: integer, description: Unix seconds }
        error:
          type: object
          description: Present when failed. A stable classification (a runtime error code such as INSUFFICIENT_CREDITS, or RUNTIME_ERROR, RUNTIME_TIMEOUT, ABANDONED, UNEXPECTED_RESULT, CONFIRMATION_REQUIRED), never a free-text message.
          properties:
            code: { type: string }
    MissionStepExecutionResult:
      allOf:
        - $ref: '#/components/schemas/MissionStepExecution'
        - type: object
          properties:
            execution_id: { type: string, format: uuid }
            mission_id: { type: string, format: uuid }
            step_id: { type: string, format: uuid }
            step_status: { type: string, enum: [pending, in_progress, completed, skipped, failed] }
            replayed: { type: boolean, description: True when the request repeated an Idempotency-Key and nothing was run }
            step: { $ref: '#/components/schemas/MissionStep' }
    MissionExecutionState:
      type: object
      properties:
        mission_id: { type: string, format: uuid }
        plan_version: { type: integer, minimum: 1 }
        mission_status: { $ref: '#/components/schemas/MissionStatus' }
        outcome:
          type: string
          enum: [empty, completed, in_progress, needs_attention, ready, waiting]
          description: >
            Derived from the steps, not stored. completed: every step is completed (a step set aside does not count);
            in_progress: a step is running, or another run holds the mission and work is left; needs_attention: a step
            failed, is blocked or was set aside; ready: nothing is wrong and a step can be run; waiting: what is left
            cannot be run yet.
        busy: { type: boolean, description: True when another orchestration holds the mission; this request ran nothing }
        progress:
          type: object
          properties:
            completed: { type: integer }
            skipped: { type: integer }
            total: { type: integer }
        ran:
          type: array
          description: The steps this request ran, in order; empty for a read or a request that found nothing to run
          items:
            type: object
            properties:
              step_id: { type: string, format: uuid }
              step_type: { type: string }
              action_type: { type: string }
              execution_id: { type: string, format: uuid }
              attempt: { type: integer }
              status: { type: string, enum: [in_progress, completed, failed] }
              error_code: { type: string }
        steps:
          type: array
          description: Every step of the current plan, in position order, with its state
          items: { $ref: '#/components/schemas/MissionStep' }
