openapi: 3.0.3
info:
  title: Trezutil API
  version: 1.0.0
  description: External REST contract baseline for Trezutil.
servers:
  - url: https://api.trezutil.example/api/v1
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/request-otp:
    post:
      summary: Send a one-time sign-in code to a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequestOTP'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOTPResponse'
        '400':
          description: INVALID_REQUEST or INVALID_PHONE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: OTP_DELIVERY_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-otp:
    post:
      summary: Exchange a one-time code for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyOTP'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'
        '400':
          description: Invalid request or code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Code refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/staff/login:
    post:
      summary: Platform staff sign-in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Renew a session with its refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'
        '401':
          description: Refresh token refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/users/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations:
    post:
      summary: Create an organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    get:
      summary: List user's organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
  /organizations/{organization_id}:
    get:
      summary: Get an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /organizations/{organization_id}/members:
    post:
      summary: Add a member to organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
    get:
      summary: List organization members
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembersPage'
  /organizations/{organization_id}/members/{user_id}:
    delete:
      summary: Remove a member from organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Member removed
        '404':
          $ref: '#/components/responses/NotFound'
  /sellers:
    post:
      summary: Create a seller profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerRequest'
      responses:
        '201':
          description: Created seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfile'
    get:
      summary: List seller profiles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Seller profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfilePage'
  /sellers/{seller_id}:
    get:
      summary: Get a seller profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SellerId'
      responses:
        '200':
          description: Seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfile'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a seller profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SellerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSellerRequest'
      responses:
        '200':
          description: Updated seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfile'
  /stores:
    post:
      summary: Create a store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Created store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
    get:
      summary: List stores
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePage'
  /stores/{store_id}:
    get:
      summary: Get a store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: Updated store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
  /listings:
    post:
      summary: Create a listing draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
    get:
      summary: List listings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: seller_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: page_token
          schema: { type: string }
      responses:
        '200':
          description: Listing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
  /listings/{listing_id}:
    get:
      summary: Get a listing
      security: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
  /listings/{listing_id}/publish:
    post:
      summary: Publish a listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
  /search/listings:
    post:
      summary: Search listings using structured or natural-language intent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchListingsRequest'
      responses:
        '200':
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchListingsResponse'
  /search:
    post:
      summary: Search listings (Web/REST)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                category_id: { type: string }
                page_size: { type: integer }
                cursor: { type: string }
                sort_field: { type: string }
                sort_direction: { type: string }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchResult' }
                  total: { type: integer }
                  has_next: { type: boolean }
  /orders:
    post:
      summary: Create an order or reservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{order_id}:
    get:
      summary: Get an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservations:
    post:
      summary: Create a reservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Created reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reservations/{reservation_id}:
    get:
      summary: Get a reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reservations/{reservation_id}/cancel:
    post:
      summary: Cancel a reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCancelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
  /availability:
    get:
      summary: Check availability for a listing
      security:
        - bearerAuth: []
      parameters:
        - name: listing_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: start_at
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: end_at
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: quantity
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: party_size
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /webhooks/whatsapp:
    post:
      summary: Receive WhatsApp webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Acknowledged
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/ai/providers:
    get:
      summary: List AI providers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderPage'
  /admin/ai/models:
    get:
      summary: List AI models
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelPage'
  /admin/ai/health:
    get:
      summary: Check AI provider health
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIHealthResponse'
  /internal/api/v1/ai/interpret:
    post:
      summary: Interpret user message and produce structured intent
      description: Internal endpoint — requires service-to-service authentication
      security:
        - internalService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIInterpretRequest'
      responses:
        '200':
          description: Interpretation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIInterpretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Rate limited or insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /packs:
    get:
      summary: List all vertical packs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all vertical packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerticalPack'
  /packs/{pack_code}:
    get:
      summary: Get a specific vertical pack
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pack_code
          required: true
          schema:
            type: string
          description: Pack code (e.g., ECOMMERCE, BOOKING, SERVICES)
      responses:
        '200':
          description: Pack details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerticalPack'
        '404':
          $ref: '#/components/responses/NotFound'
  /packs/{pack_code}/enable:
    post:
      summary: Enable a pack for an organization
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pack_code
          required: true
          schema:
            type: string
          description: Pack code to enable
        - in: query
          name: org_id
          required: true
          schema:
            type: string
          description: Organization ID
      responses:
        '200':
          description: Pack enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /packs/{pack_code}/disable:
    post:
      summary: Disable a pack for an organization
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pack_code
          required: true
          schema:
            type: string
          description: Pack code to disable
        - in: query
          name: org_id
          required: true
          schema:
            type: string
          description: Organization ID
      responses:
        '200':
          description: Pack disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackActionResponse'
  /packs/org:
    get:
      summary: List enabled packs for an organization
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
          description: Organization ID
      responses:
        '200':
          description: Enabled packs for organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgPacksResponse'
  /packs/action:
    get:
      summary: Check if an action is supported for an organization
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
          description: Organization ID
        - in: query
          name: action
          required: true
          schema:
            type: string
          description: Action type (e.g., CREATE_ORDER, CREATE_RESERVATION)
      responses:
        '200':
          description: Action support check result
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/ActionCheckResponse'

  /conversations:
    get:
      summary: The caller's own conversations (history)
      description: >
        Read-only. The signed-in user's conversations on one channel, the most recently active first, each titled by
        the first message the user wrote. A guest conversation (never claimed by an account) is never listed.
      security:
        - bearerAuth: []
      parameters:
        - name: channel
          in: query
          schema: { type: string, default: web, enum: [web, whatsapp] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The conversations (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        channel: { type: string }
                        external_id: { type: string, description: 'The channel identity (sender_external_id) that continues it' }
                        title: { type: string }
                        message_count: { type: integer }
                        created_at: { type: integer, description: Unix seconds }
                        last_activity_at: { type: integer, description: Unix seconds }
        '400': { description: 'INVALID_CHANNEL or INVALID_LIMIT' }
        '401': { description: Not signed in }
  /conversations/{conversation_id}/messages:
    get:
      summary: The transcript of one of the caller's conversations
      description: >
        Read-only. The text of each message, oldest first; every answer follows the question it answers. The
        processor's internal data, offers and cards are not part of the transcript.
      security:
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transcript (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id: { type: string, format: uuid }
                  external_id: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        direction: { type: string, enum: [inbound, outbound] }
                        text: { type: string }
                        created_at: { type: integer, description: Unix seconds }
        '401': { description: Not signed in }
        '403': { description: 'The conversation belongs to another user, or to no account' }
        '404': { description: No such conversation }
  /missions:
    post:
      summary: Create a draft mission (Organiser)
      description: >
        Records a goal the caller delegates to Trezutil. Only `objective` is required; the kind, title, place and
        head count are read from it unless given. The mission is always a draft: nothing is searched, booked or
        ordered and no credit is used. A retry carrying the same Idempotency-Key returns the first mission (200).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionRequest'
      responses:
        '201':
          description: Draft mission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '200':
          description: The mission an earlier request with the same Idempotency-Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List the caller's missions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/MissionStatus' }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: The caller's missions, most recently changed first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /missions/{mission_id}:
    get:
      summary: Get one of the caller's missions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Change a mission or move it through its lifecycle
      description: >
        Any field may be changed while the mission is not completed or cancelled. A `status` change must follow the
        lifecycle: draft to active or cancelled; active to paused, completed or cancelled; paused to active or
        cancelled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMissionRequest'
      responses:
        '200':
          description: Updated mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /missions/{mission_id}/steps:
    post:
      summary: Add a step to a mission
      description: >
        Records a pending step at the next position. Steps are recorded, not executed: `action_type` only names the
        commerce action a later phase will run through the Commerce Action Runtime. At most 30 steps per mission;
        a completed or cancelled mission takes none.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionStepRequest'
      responses:
        '201':
          description: Step recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionStep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List a mission's steps in order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Steps ordered by position
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MissionStep' } }
                  total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /missions/{mission_id}/plan:
    post:
      summary: Prepare the plan of a mission (Organiser)
      description: >
        A planner turns the mission into a plan: ordered steps that are intentions to act, each naming the commerce
        action it will run and whether the Commerce OS can run it today (`action_support`). Nothing is searched,
        reserved, ordered or paid, no credit is used and the mission stays as it is (a draft is not activated).
        Planning is repeatable: the same request again returns the same plan (200) and never a second set of steps.
        A mission that already has a different plan answers 409 PLAN_EXISTS unless `replace` is true; a replacement is
        the next version and the old one is kept (`superseded`). A mission whose kind has no template (OTHER,
        BUSINESS_TRIP, PROJECT) is not planned: the answer is 200 with `status: needs_information` and no steps.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                replace: { type: boolean, default: false, description: Prepare a new version when the mission already has a different plan }
      responses:
        '201':
          description: A new plan version was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPlan'
        '200':
          description: The plan that already exists for this request, or needs_information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PLAN_EXISTS, PLAN_IN_PROGRESS, MISSION_CLOSED or PLAN_CONFLICT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      summary: Read the plan of a mission
      description: >
        The current plan, or one version of its history with `version`. A mission without a plan answers 200 with
        `status: none`, which is a state, not an error.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - in: query
          name: version
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /missions/{mission_id}/steps/{step_id}/execute:
    post:
      summary: Execute one step of a mission (Organiser)
      description: >
        Runs ONE step through the existing Commerce Action Runtime, on request; nothing runs a whole mission. The
        request has no body: what the step asks of the runtime is decided server-side from the mission and the step,
        never by the client. The first executable action is SEARCH_LISTINGS (a catalogue search, in the vertical the
        step maps to and the mission's place if it has one); other steps answer 422 STEP_NOT_EXECUTABLE.
        The runtime remains the only place where the action runs and where credits are checked, reserved, consumed or
        released; the mission layer never touches them. Every attempt is a durable execution record: a summary and
        references (for a search, the ids of the first listings found), not a copy of commerce data.
        The same step with the same Idempotency-Key is the same execution: a repeated request returns it (200) and
        runs nothing. A failed step can be executed again (a new attempt); a completed step cannot (409). A failure
        of the runtime is a recorded outcome (201 with status `failed` and a stable `error.code`), not an HTTP error.
        An attempt that never recorded its outcome is given up on after two minutes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - in: path
          name: step_id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: An attempt was run (completed or failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionStepExecutionResult'
        '200':
          description: The execution an earlier request with the same Idempotency-Key made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionStepExecutionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: STEP_IN_PROGRESS, STEP_NOT_RUNNABLE (completed or skipped, or its plan was replaced), STEP_WAITING (a step it depends on has not completed), STEP_NEEDS_INPUT (the mission's dates, or a listing, are missing) or MISSION_NOT_RUNNABLE (paused or closed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: STEP_NOT_EXECUTABLE, the step has no executable action behind it yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /missions/{mission_id}/run:
    post:
      summary: Run a whole mission (Organiser)
      description: >
        Orchestrates the mission, on request: it runs, one step after another and in the order of the plan's dependency
        graph, the steps that are ready, each through the existing Commerce Action Runtime (the only place where actions
        run and where credits are checked, reserved, consumed or released; the orchestrator never touches them). A step
        runs only after every step it depends on has completed, and takes what it needs from them by reference (an
        availability check takes the first listing the search found and the mission's dates). Only the steps of the
        mission's current plan are run.
        The body is optional. `on_failure` is `stop` (the default: stop at the first failure) or `continue` (carry on with
        the steps that do not depend on the failed one). What depends on a failed, blocked or skipped step is BLOCKED and
        never run; what completed stays completed (nothing is rolled back); a failed step is never retried by a run (that
        is /resume) and never retried by itself. A step whose action needs the person's confirmation is blocked for them:
        nothing is confirmed on their behalf.
        Running is idempotent: a completed step is never run again, so repeating the request is safe and runs only what is
        still to be done. One orchestration of a mission runs at a time (a lease that expires by itself if a process dies):
        while another holds it, the answer is 202 with the current state and nothing was run by this request.
        A draft mission becomes active when its first step is run, and completed when every step is completed. The mission
        has no new status: `outcome` is derived from its steps.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                on_failure: { type: string, enum: [stop, continue], default: stop }
      responses:
        '200':
          description: The state of the mission after the run (also when there was nothing left to run, or the mission was already completed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionState' }
        '202':
          description: Another orchestration holds the mission; nothing was run by this request. The state is as read (busy is true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionState' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PLAN_REQUIRED (the mission has no plan), MISSION_GRAPH_INVALID (the stored dependencies form a cycle or are invalid; nothing is run) or MISSION_NOT_RUNNABLE (paused or cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /missions/{mission_id}/resume:
    post:
      summary: Resume a mission after a failure (Organiser)
      description: >
        A run that also runs, once each in this call, the steps whose latest attempt failed or went silent. Steps that
        completed are never run again; a step blocked by a confirmation requirement is never retried. Same body, answers
        and guarantees as /run. Each call retries a failed step at most once: there is no automatic or unbounded retry.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                on_failure: { type: string, enum: [stop, continue], default: stop }
      responses:
        '200':
          description: The state of the mission after the resume
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionState' }
        '202':
          description: Another orchestration holds the mission; nothing was run by this request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionState' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PLAN_REQUIRED, MISSION_GRAPH_INVALID or MISSION_NOT_RUNNABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /missions/{mission_id}/execution:
    get:
      summary: The execution state of a mission (Organiser)
      description: >
        Where the mission's current plan stands: the mission's outcome and progress, and every step with its state
        (pending, ready, running, completed, failed, blocked, skipped), what it waits for and, when blocked, why. Read-only:
        nothing is run or changed. READY and BLOCKED are derived from the step statuses and the plan's dependencies, never
        stored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: The execution state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionState' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PLAN_REQUIRED or MISSION_GRAPH_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /payments:
    post:
      summary: Create a payment for an order
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201':
          description: Payment created (or the one already created with this key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '400': { description: 'INVALID_REQUEST, MISSING_ORDER_ID, INVALID_AMOUNT or INVALID_PAYMENT_METHOD', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '409': { description: 'IDEMPOTENCY_CONFLICT or ORDER_NOT_PAYABLE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: 'PAYMENT_PROVIDER_UNAVAILABLE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /payments/{payment_id}:
    get:
      summary: Get a payment
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/OrganizationQuery'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /payments/{payment_id}/cancel:
    post:
      summary: Cancel a payment that is not captured
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/OrganizationQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Payment cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /payments/{payment_id}/capture:
    post:
      summary: Capture an authorized payment (staff)
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/OrganizationQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapturePaymentRequest' }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /payments/{payment_id}/refund:
    post:
      summary: Refund a captured payment (staff)
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/OrganizationQuery'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPaymentRequest' }
      responses:
        '201':
          description: Refund recorded (succeeded, pending or failed as refund_status says)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        '202':
          description: 'The provider did not give a final answer: the refund stays pending (outcome unknown), neither done nor refused'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '409': { description: 'REFUND_ALREADY_EXISTS, REFUND_EXCEEDS_REMAINING or IDEMPOTENCY_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: 'REFUND_REFUSED: the provider refused or offers no refund', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /payments/{payment_id}/status:
    get:
      summary: Payment status, read back from the provider
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/OrganizationQuery'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /payments/{payment_id}/refunds/{refund_id}:
    get:
      summary: Get a refund
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/OrganizationQuery'
      responses:
        '200':
          description: Refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /webhooks/payments/{provider_code}:
    post:
      summary: Payment provider webhook, authenticated by the provider signature
      tags: [Webhooks]
      security: []
      parameters:
        - in: path
          name: provider_code
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganizationQuery'
        - in: header
          name: Stripe-Signature
          schema: { type: string }
        - in: header
          name: X-Webhook-Signature
          description: SasPay signature, sent with X-Webhook-Timestamp
          schema: { type: string }
        - in: header
          name: X-Webhook-Timestamp
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Processed, already processed, or kept for review
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        '401': { description: 'WEBHOOK_SIGNATURE_INVALID', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'WEBHOOK_IN_PROGRESS: send it again', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: 'Not processed: send it again', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalService:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
      description: Service-to-service authentication token for internal endpoints
  parameters:
    OrganizationId:
      in: path
      name: organization_id
      required: true
      schema: { type: string, format: uuid }
    SellerId:
      in: path
      name: seller_id
      required: true
      schema: { type: string, format: uuid }
    StoreId:
      in: path
      name: store_id
      required: true
      schema: { type: string, format: uuid }
    MissionId:
      in: path
      name: mission_id
      required: true
      schema: { type: string, format: uuid }
    ListingId:
      in: path
      name: listing_id
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      in: path
      name: payment_id
      required: true
      schema: { type: string, format: uuid }
    RefundId:
      in: path
      name: refund_id
      required: true
      schema: { type: string, format: uuid }
    OrganizationQuery:
      in: query
      name: organization_id
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CreatePaymentRequest:
      type: object
      required: [order_id, amount_minor, currency, payment_method_type, payment_method_id]
      properties:
        order_id: { type: string }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3, default: USD }
        payment_method_type: { type: string, enum: [MOBILE_MONEY, CARD, BANK_TRANSFER, CASH, WALLET, OTHER] }
        payment_method_id: { type: string }
        idempotency_key: { type: string }
        metadata: { type: object, additionalProperties: true }
    PaymentResponse:
      type: object
      properties:
        payment_id: { type: string }
        order_id: { type: string }
        status: { type: string, enum: [created, pending, authorized, captured, failed, cancelled, expired, refunded, partially_refunded] }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        payment_method_type: { type: string }
        payment_method_id: { type: string }
        provider_id: { type: string }
        provider_payment_id: { type: string }
        authorized_at: { type: integer, nullable: true }
        captured_at: { type: integer, nullable: true }
        cancelled_at: { type: integer, nullable: true }
        failed_at: { type: integer, nullable: true }
        failure_reason: { type: string, nullable: true }
        refunded_amount: { type: integer, format: int64 }
        created_at: { type: string }
        updated_at: { type: string }
    RefundResult:
      type: object
      properties:
        payment_id: { type: string }
        status: { type: string, description: Status of the payment }
        refund_id: { type: string }
        refund_status: { type: string, enum: [pending, succeeded, failed, cancelled] }
        refund_amount: { type: integer, format: int64 }
        outcome: { type: string, enum: [unknown] }
    CapturePaymentRequest:
      type: object
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3, default: USD }
    RefundPaymentRequest:
      type: object
      properties:
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3, default: USD }
    RefundResponse:
      type: object
      properties:
        refund_id: { type: string }
        payment_id: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, cancelled] }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        provider_refund_id: { type: string }
        processed_at: { type: integer, nullable: true }
        failed_at: { type: integer, nullable: true }
        failure_reason: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    SearchResult:
      type: object
      description: Field names as the search service writes them.
      properties:
        ListingID: { type: string, format: uuid }
        Title: { type: string }
        Vertical: { type: string }
        PriceAmount: { type: number }
        PriceCurrency: { type: string }
        AvailabilityStatus: { type: string }
        DistanceMeters: { type: number, nullable: true }
        Score: { type: number }
        MatchedAttributes: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        Location: { type: object, nullable: true, additionalProperties: true }
        Seller: { type: object, nullable: true, additionalProperties: true }
        Store: { type: object, nullable: true, additionalProperties: true }
        PrimaryMediaURL: { type: string, nullable: true }
        CompareAtAmount: { type: number, nullable: true }
        DiscountPercent: { type: integer }
        PublishedAt: { type: integer }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
    Listing:
      type: object
      required: [id, seller_id, type, title, status]
      properties:
        id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        type: { type: string, enum: [product, property, vehicle, food, service, accommodation, other] }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, review, published, paused, sold, rented, completed, archived] }
        price: { $ref: '#/components/schemas/Money' }
        attributes: { type: object, additionalProperties: true }
    CreateListingRequest:
      type: object
      required: [seller_id, type, title]
