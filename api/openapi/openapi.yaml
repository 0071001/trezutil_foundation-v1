openapi: 3.0.3
info:
  title: Trezutil API
  version: 1.0.0
  description: External REST contract baseline for Trezutil.
servers:
  - url: https://api.trezutil.example/v1
paths:
/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
/auth:
    post:
      request-otp:
        summary: Request OTP for authentication
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRequestOTP'
        responses:
          '200':
            description: OTP requested
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthOTPResponse'
    post:
      verify-otp:
        summary: Verify OTP for authentication
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyOTP'
        responses:
          '200':
            description: OTP verified
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthVerifyResponse'
    get:
      users-me:
        summary: Get current user profile
        security:
          - bearerAuth: []
        responses:
          '200':
            description: User profile
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/User'
    patch:
      users-me:
        summary: Update current user profile
        security:
          - bearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateRequest'
        responses:
          '200':
            description: Updated user profile
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/User'
    get:
      users-me-roles:
        summary: Get current user roles
        security:
          - bearerAuth: []
        responses:
          '200':
            description: User roles
            content:
              application/json:
                 schema:
                  $ref: '#/components/schemas/UserRolesResponse'
  /organizations:
    post:
      summary: Create an organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    get:
      summary: List user's organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
  /organizations/{organization_id}:
    get:
      summary: Get an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
              $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /organizations/{organization_id}/members:
    post:
      summary: Add a member to organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
    get:
      summary: List organization members
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembersPage'
  /organizations/{organization_id}/members/{user_id}:
    delete:
      summary: Remove a member from organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Member removed
        '404':
          $ref: '#/components/responses/NotFound'
  /sellers:
    post:
      summary: Create a seller profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSellerRequest'
      responses:
        '201':
          description: Created seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfile'
    get:
      summary: List seller profiles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Seller profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfilePage'
  /sellers/{seller_id}:
    get:
      summary: Get a seller profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SellerId'
      responses:
        '200':
          description: Seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfile'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a seller profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SellerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSellerRequest'
      responses:
        '200':
          description: Updated seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfile'
  /stores:
    post:
      summary: Create a store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Created store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
    get:
      summary: List stores
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: organization_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePage'
  /stores/{store_id}:
    get:
      summary: Get a store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a store
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: Updated store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
  parameters:
    OrganizationId:
      in: path
      name: organization_id
      required: true
      schema: { type: string, format: uuid }
    SellerId:
      in: path
      name: seller_id
      required: true
      schema: { type: string, format: uuid }
    StoreId:
      in: path
      name: store_id
      required: true
      schema: { type: string, format: uuid }
    ListingId:
      summary: Create a listing draft
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
    get:
      summary: List listings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: seller_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: page_token
          schema: { type: string }
      responses:
        '200':
          description: Listing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
  /listings/{listing_id}:
    get:
      summary: Get a listing
      security: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListingRequest'
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
  /listings/{listing_id}/publish:
    post:
      summary: Publish a listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
  /search/listings:
    post:
      summary: Search listings using structured or natural-language intent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchListingsRequest'
      responses:
        '200':
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchListingsResponse'
  /search:
    post:
      summary: Search listings (Web/REST)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                category_id: { type: string }
                page_size: { type: integer }
                cursor: { type: string }
                sort_field: { type: string }
                sort_direction: { type: string }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchResult' }
                  total: { type: integer }
                  has_next: { type: boolean }
  /orders:
    post:
      summary: Create an order or reservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{order_id}:
    get:
      summary: Get an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservations:
    post:
      summary: Create a reservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Created reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reservations/{reservation_id}:
    get:
      summary: Get a reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reservations/{reservation_id}/cancel:
    post:
      summary: Cancel a reservation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservation_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reservation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCancelResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
  /availability:
    get:
      summary: Check availability for a listing
      security:
        - bearerAuth: []
      parameters:
        - name: listing_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: start_at
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: end_at
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: quantity
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: party_size
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /webhooks/whatsapp:
    post:
      summary: Receive WhatsApp webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Acknowledged
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ListingId:
      in: path
      name: listing_id
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
    Listing:
      type: object
      required: [id, seller_id, type, title, status]
      properties:
        id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        type: { type: string, enum: [product, property, vehicle, food, service, accommodation, other] }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, review, published, paused, sold, rented, completed, archived] }
        price: { $ref: '#/components/schemas/Money' }
        attributes: { type: object, additionalProperties: true }
    CreateListingRequest:
      type: object
      required: [seller_id, type, title]
      properties:
        seller_id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        attributes: { type: object, additionalProperties: true }
    UpdateListingRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        attributes: { type: object, additionalProperties: true }
    ListingPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Listing' }
        next_page_token: { type: string }
    SearchListingsRequest:
      type: object
      properties:
        natural_language: { type: string }
        query: { type: string }
        filters: { type: object, additionalProperties: true }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    SearchListingsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Listing' }
        interpretation:
          type: object
          additionalProperties: true
        next_page_token: { type: string }
    CreateOrderRequest:
      type: object
      required: [buyer_id, items]
      properties:
        buyer_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [listing_id, quantity]
            properties:
              listing_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        status: { type: string }
        total: { $ref: '#/components/schemas/Money' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
    AuthRequestOTP:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 10, maxLength: 20 }
    AuthOTPResponse:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        code_sent: { type: boolean }
    AuthVerifyOTP:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 10 }
    AuthVerifyResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, phone, display_name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, minLength: 10, maxLength: 20 }
        email: { type: string, format: email, nullable: true }
        display_name: { type: string }
        status: { type: string, enum: [active, suspended, pending_verification] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time, nullable: true }
    UserUpdateRequest:
      type: object
      properties:
        display_name: { type: string }
        email: { type: string, format: email }
    UserRolesResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: string
            enum: [customer, seller, staff, admin, operator, moderation, delivery_partner]
    Organization:
      type: object
      required: [id, type, legal_name, display_name, status, verification_status, country, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [individual, business, company, cooperative, association, other] }
        legal_name: { type: string }
        display_name: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        status: { type: string, enum: [active, suspended, closed] }
        country: { type: string }
        province: { type: string }
        city: { type: string }
        address: { type: string }
        verification_status: { type: string, enum: [unverified, pending, verified, rejected, suspended] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateOrganizationRequest:
      type: object
      required: [type, legal_name, display_name, country]
      properties:
        type: { type: string, enum: [individual, business, company, cooperative, association, other] }
        legal_name: { type: string }
        display_name: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        country: { type: string }
        province: { type: string }
        city: { type: string }
        address: { type: string }
    UpdateOrganizationRequest:
      type: object
      properties:
        legal_name: { type: string }
        display_name: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, suspended, closed] }
        address: { type: string }
    OrganizationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        next_page_token: { type: string }
    OrganizationMember:
      type: object
      required: [user_id, membership_role, status]
      properties:
        user_id: { type: string, format: uuid }
        membership_role: { type: string, enum: [owner, admin, manager, staff, accountant, sales, operations] }
        status: { type: string, enum: [active, suspended, invited] }
        joined_at: { type: string, format: date-time }
    AddMemberRequest:
      type: object
      required: [user_id, membership_role]
      properties:
        user_id: { type: string, format: uuid }
        membership_role: { type: string, enum: [owner, admin, manager, staff, accountant, sales, operations] }
    OrganizationMembersPage:
      type: object
      properties:
        items:
          type: array
