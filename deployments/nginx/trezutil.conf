# Trezutil on https://trezutil.com, behind the nginx that already runs on the host (the one serving Odoo).
#
# Install (as root, on the VPS) — see docs/deployment/VPS_DEPLOYMENT.md for the whole procedure:
#   cp deployments/nginx/trezutil.conf /etc/nginx/sites-available/trezutil.conf
#   ln -s /etc/nginx/sites-available/trezutil.conf /etc/nginx/sites-enabled/trezutil.conf
#   certbot certonly --webroot -w /var/www/html -d trezutil.com -d www.trezutil.com   (before enabling the 443 blocks)
#   nginx -t && systemctl reload nginx               # reload, never restart: Odoo keeps its connections
#
# Written for nginx 1.24 (Ubuntu 24.04): HTTP/2 is enabled on the listen line ("http2 on;" needs nginx 1.25.1+).
# This file only adds server blocks for trezutil.com and www.trezutil.com. It does not change the Odoo server blocks,
# the default server or nginx.conf. The gateway listens on 127.0.0.1:18080 (GATEWAY_LOCAL_PORT in app.env and in
# docker-compose.vps.yml): keep the three in step.

upstream trezutil_gateway {
    server 127.0.0.1:18080;
    keepalive 16;
}

# HTTP: the ACME challenge for certbot, everything else to HTTPS on the apex domain.
server {
    listen 80;
    listen [::]:80;
    server_name trezutil.com www.trezutil.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://trezutil.com$request_uri; }
}

# www.trezutil.com → trezutil.com (one origin: sessions, CORS and links stay on trezutil.com).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trezutil.com;

    ssl_certificate     /etc/letsencrypt/live/trezutil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trezutil.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://trezutil.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trezutil.com;

    ssl_certificate     /etc/letsencrypt/live/trezutil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trezutil.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:trezutil_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The gateway refuses bodies over 1 MiB; stop anything bigger here.
    client_max_body_size 2m;
    server_tokens off;

    # The administration console and the staff sign-in are for the team only: allow the office or VPN addresses.
    location ~ ^/(admin|api/v1/admin|api/v1/auth/staff)(/|$) {
        allow 127.0.0.1;
        # allow 203.0.113.0/24;   # the team's addresses
        deny all;
        proxy_pass http://trezutil_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://trezutil_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # This proxy is the edge: replace whatever the client sent, so the gateway sees the real client
        # (TRUSTED_PROXY_HOPS=1 in app.env).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/trezutil.access.log;
    error_log  /var/log/nginx/trezutil.error.log warn;
}
