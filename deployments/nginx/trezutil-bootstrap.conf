# First step only: lets certbot prove trezutil.com before the certificate exists (nginx refuses a 443 block whose
# certificate file is missing). Replace it with trezutil.conf as soon as `certbot certonly` has succeeded.
#
#   cp deployments/nginx/trezutil-bootstrap.conf /etc/nginx/sites-available/trezutil.conf
#   ln -s /etc/nginx/sites-available/trezutil.conf /etc/nginx/sites-enabled/trezutil.conf
#   nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/html -d trezutil.com -d www.trezutil.com
#   cp deployments/nginx/trezutil.conf /etc/nginx/sites-available/trezutil.conf && nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name trezutil.com www.trezutil.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 503 "Trezutil arrive bientôt.\n"; }
}
