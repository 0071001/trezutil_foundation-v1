# TLS in front of the gateway (Caddy). Put it on top of the application stack:
#
#   docker compose -f deployments/docker/docker-compose.app.yml \
#                  -f deployments/docker/docker-compose.proxy.yml \
#                  --env-file deployments/docker/app.env up -d
#
# app.env must set PUBLIC_HOST (the domain, with its DNS record pointing at this host), ACME_EMAIL,
# TRUSTED_PROXY_HOPS=1, CORS_ALLOWED_ORIGINS=https://<PUBLIC_HOST> and ADMIN_ALLOW_IPS (who may reach
# the administration console). Ports 80 and 443 must be open.
# The gateway then stops publishing its own port: the only way in is through TLS.
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required (the public domain name)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required (a mailbox Let's Encrypt can reach)}
      # who may reach /admin and the staff sign-in (addresses or ranges, space-separated); default: nobody
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # the certificates: keep this volume, or every restart asks for new ones
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [internal]

  api-gateway:
    # reachable only from the proxy, on the private network
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
