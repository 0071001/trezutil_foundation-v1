# Trezutil MVP — single-host deployment (VPS / Docker).
#
#   cp deployments/docker/app.env.example deployments/docker/app.env   # fill in secrets
#   docker compose -f deployments/docker/docker-compose.app.yml --env-file deployments/docker/app.env up -d --build
#
# Only the gateway publishes a port. PostgreSQL, OpenSearch and every internal
# service stay on the private compose network. Put a TLS-terminating reverse
# proxy (Caddy, nginx, Traefik) in front of port 8080 in production.

x-service: &service
  image: trezutil:latest
  pull_policy: never # built locally by the migrate service
  restart: unless-stopped
  environment: &service-env
    # Any value except development/test enforces strong secrets and explicit CORS.
    APP_ENV: ${APP_ENV:-production}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Proxies in front of the gateway that append to X-Forwarded-For (1 behind Caddy/nginx/Traefik).
    # Per-IP rate limits see the real client only when this matches the topology.
    TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (32+ chars)}
    JWT_ISSUER: ${JWT_ISSUER:-trezutil}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-trezutil-api}
    OPENSEARCH_URL: http://opensearch:9200
    OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-trezutil-listings-v1}
    OPENSEARCH_ALIAS: ${OPENSEARCH_ALIAS:-trezutil-listings}
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trezutil}
      POSTGRES_USER: ${POSTGRES_USER:-trezutil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trezutil} -d ${POSTGRES_DB:-trezutil}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Internal network only; enable the security plugin if OpenSearch is
      # ever exposed beyond this host.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [opensearch_data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [internal]

  migrate:
    image: trezutil:latest
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        # Public WhatsApp Business number (digits only) behind the site's WhatsApp button; empty hides the button.
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
        # Public store pages of the mobile app (https), once it is published; empty means the store is not mentioned.
        VITE_PLAY_STORE_URL: ${VITE_PLAY_STORE_URL:-}
        VITE_APP_STORE_URL: ${VITE_APP_STORE_URL:-}
        # "true" shows placeholders for the channels that are not connected yet (staging only; empty in production).
        VITE_CHANNEL_PLACEHOLDERS: ${VITE_CHANNEL_PLACEHOLDERS:-}
        # Label in the administration header so staff never mistake staging for production; empty or "production" shows none.
        VITE_APP_ENV: ${VITE_APP_ENV:-}
    command: ["/app/bin/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  identity-service:
    <<: *service
    command: ["/app/bin/identity-service"]
    environment:
      <<: *service-env
      HTTP_PORT: "8086"
      OTP_CODE_SECRET: ${OTP_CODE_SECRET:?OTP_CODE_SECRET is required (32+ random chars, different from JWT_SECRET)}
      # Sign in with Google: the public OAuth client id (Google Cloud Console). Empty: the Google button is hidden.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-https://graph.facebook.com/v20.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-}
      # The language code of that template as approved by Meta (fr, en…); it must match exactly.
      WHATSAPP_OTP_TEMPLATE_LANG: ${WHATSAPP_OTP_TEMPLATE_LANG:-en}
      # The console's health and channel pages say which integrations are configured: only "true" or empty
      # reaches this service, never a key.
      STRIPE_CONFIGURED: ${STRIPE_SECRET_KEY:+true}
      AI_CONFIGURED: ${AI_PROVIDER:+true}
      METRICS_CONFIGURED: ${METRICS_TOKEN:+true}
      # Services probed by GET /api/v1/admin/health (name=url, comma-separated); the default fits this file.
      HEALTH_TARGETS: ${HEALTH_TARGETS:-gateway=http://api-gateway:8080/healthz,search=http://search-service:8081/readyz,conversation=http://conversation-service:8091/readyz,commerce=http://order-service:8085/readyz,payment=http://payment-service:8083/readyz}

  search-service:
    <<: *service
    command: ["/app/bin/search-service"]
    environment:
      <<: *service-env
      HTTP_PORT: "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  conversation-service:
    <<: *service
    command: ["/app/bin/conversation-service"]
    environment:
      <<: *service-env
      HTTP_PORT: "8091"
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fr}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-https://graph.facebook.com/v20.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      # Model-assisted intent classification (keyword routing when unset).
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EFFORT: ${AI_EFFORT:-low}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  order-service:
    <<: *service
    command: ["/app/bin/order-service"]
    environment:
      <<: *service-env
      HTTP_PORT: "8085"

  payment-service:
    <<: *service
    command: ["/app/bin/payment-service"]
    environment:
      <<: *service-env
      HTTP_PORT: "8083"
      # Referenced by the organization's 'stripe' providers row
      # (secret_ref = env:STRIPE_SECRET_KEY, webhook_secret_ref = env:STRIPE_WEBHOOK_SECRET).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_WEBHOOK_SECRET: ${PAYPAL_WEBHOOK_SECRET:-}
      # Trezutil's own SasPay account (platform 'saspay' providers row, scripts/ops/set-saspay.sh).
      SASPAY_SECRET_KEY: ${SASPAY_SECRET_KEY:-}
      SASPAY_WEBHOOK_SECRET: ${SASPAY_WEBHOOK_SECRET:-}
      PAYMENT_PROVIDER_REFRESH_SECONDS: ${PAYMENT_PROVIDER_REFRESH_SECONDS:-60}

  api-gateway:
    <<: *service
    command: ["/app/bin/api-gateway"]
    environment:
      GATEWAY_PORT: ":8080"
      # Bearer token for GET /metrics on this internet-facing gateway (unset = not served).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Content-Security-Policy: report-only (default: reports go to /csp-report and the logs), enforce, or off.
      CSP_MODE: ${CSP_MODE:-report-only}
      WEB_ROOT: /app/web
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (public origin of the web app)}
      IDENTITY_SERVICE_URL: http://identity-service:8086
      SEARCH_SERVICE_URL: http://search-service:8081
      CONVERSATION_SERVICE_URL: http://conversation-service:8091
      COMMERCE_SERVICE_URL: http://order-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8083
    depends_on:
      - identity-service
      - search-service
      - conversation-service
      - order-service
      - payment-service
    ports:
      - "${GATEWAY_PUBLISH:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres_data:
  opensearch_data:
