# Scrape configuration for deployments/docker/docker-compose.app.yml (+ the
# monitoring overlay): targets are the compose service names on the private
# network. Alert rules: alerts.yml.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trezutil-gateway
    # The gateway is internet-facing: it serves /metrics only with METRICS_TOKEN.
    authorization:
      credentials_file: /etc/prometheus/token/metrics_token
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: trezutil-services
    static_configs:
      - targets:
          - "search-service:8081"
          - "payment-service:8083"
          - "order-service:8085"
          - "identity-service:8086"
          - "conversation-service:8091"
